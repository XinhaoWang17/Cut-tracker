<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Apple PWA 必备 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="十英里备赛">
<meta name="mobile-web-app-capable" content="yes">
<!-- 根据系统主题动态设定 theme-color，由 JS 控制 -->
<meta name="theme-color" id="themeColor" content="#1C1C22">
<title>TEN MILE · 训练追踪</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== 主题变量 ===== */
:root {
  --bg:      #1C1C22;
  --card:    #242429;
  --border:  #2E2E35;
  --border2: #38383F;
  --text:    #ECEAE6;
  --text2:   #AAA8A4;
  --text3:   #777;
  --text4:   #555;
  --text5:   #3A3A3A;
  --red:     #E8453C;
  --blue:    #3A8EE6;
  --green:   #4DC85A;
  --yellow:  #F7C048;
  --purple:  #A855F7;
  --shadow:  0 2px 12px rgba(0,0,0,0.4);
  --safe-top: env(safe-area-inset-top, 20px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg:      #F2EFE9;
    --card:    #FFFFFF;
    --border:  #E0DDD6;
    --border2: #CCC9C0;
    --text:    #1A1A20;
    --text2:   #555;
    --text3:   #888;
    --text4:   #AAA;
    --text5:   #CCC;
    --red:     #D43830;
    --blue:    #2468B4;
    --green:   #2E9E3A;
    --yellow:  #C98A00;
    --purple:  #8B3DB5;
    --shadow:  0 2px 12px rgba(0,0,0,0.10);
    color-scheme: light;
  }
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  max-width: 480px;
  margin: 0 auto;
  padding-top: var(--safe-top);
  padding-bottom: calc(var(--safe-bottom) + 8px);
  transition: background 0.3s, color 0.3s;
}

.mono { font-family: 'JetBrains Mono', monospace; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
input { font-family: 'JetBrains Mono', monospace; }
input:focus { outline: none; border-color: var(--red) !important; }

/* ===== PWA 安装提示 ===== */
.install-hint {
  margin: 8px 16px 0;
  padding: 10px 14px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--blue) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--blue) 30%, transparent);
  font-size: 12px;
  color: var(--blue);
  line-height: 1.5;
  display: none;
}
.install-hint.show { display: flex; align-items: flex-start; gap: 8px; }
.install-hint button.dismiss {
  margin-left: auto; flex-shrink: 0; font-size: 14px;
  color: var(--text3); padding: 0 4px;
}

/* ===== Header ===== */
.header {
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  transition: background 0.3s;
}
.header-top { display: flex; justify-content: space-between; align-items: flex-start; }
.brand {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 3px;
  color: var(--red); font-weight: 600; margin-bottom: 4px;
}
.header h1 { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
.quick-btn {
  padding: 8px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  transition: all 0.2s; letter-spacing: 0.5px; flex-shrink: 0;
}
.quick-btn.on  { background: color-mix(in srgb, var(--red) 12%, transparent); border: 1px solid var(--red); color: var(--red); }
.quick-btn.off { background: var(--card); border: 1px solid var(--border2); color: var(--text3); }
.quick-banner {
  margin-top: 10px; padding: 8px 12px; border-radius: 8px;
  background: color-mix(in srgb, var(--red) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 20%, transparent);
  font-size: 11px; color: var(--red); line-height: 1.4; display: none;
}
.quick-banner.show { display: block; }
.race-goal {
  margin-bottom: 14px; padding: 13px 14px; border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--red) 40%, var(--border));
  background: color-mix(in srgb, var(--red) 8%, var(--card));
  box-shadow: var(--shadow);
}
.race-goal .goal-kicker {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.5px;
  color: var(--red); font-weight: 700; margin-bottom: 5px;
}
.race-goal .goal-main { font-size: 14px; color: var(--text2); font-weight: 700; line-height: 1.45; }
.race-goal .goal-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* ===== Tab bar ===== */
.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: background 0.3s;
}
.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 10px 0 8px; border-bottom: 2px solid transparent;
  transition: color 0.2s; color: var(--text4);
}
.tab-item.active { color: var(--red); border-bottom-color: var(--red); }
.tab-item .icon  { font-size: 18px; }
.tab-item .label { font-size: 10px; margin-top: 2px; font-weight: 600; letter-spacing: 1px; }

/* ===== Content ===== */
.content { padding: 16px 16px 120px; min-height: 60vh; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ===== Day selector ===== */
.day-selector { display: flex; gap: 6px; margin-bottom: 12px; }
.day-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 10px 0; border-radius: 12px;
  border: 2px solid var(--border2);
  transition: all 0.2s; background: var(--card);
  box-shadow: var(--shadow);
}
.day-btn.active {
  background: color-mix(in srgb, var(--c) 10%, var(--card));
  border-color: var(--c);
}
.day-btn .emoji  { font-size: 16px; }
.day-btn .d-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--text4);
}
.day-btn.active .d-label { color: var(--c); }

/* ===== Variant toggle ===== */
.variant-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
.var-btn {
  flex: 1; padding: 8px 0; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--card);
  font-size: 12px; font-weight: 600; color: var(--text4);
  transition: all 0.2s;
}
.var-btn.active {
  background: color-mix(in srgb, var(--c) 12%, var(--card));
  border-color: var(--c); color: var(--c);
}

/* ===== Section header ===== */
.section-hdr { border-left: 3px solid var(--c); padding-left: 12px; margin-bottom: 16px; }
.section-hdr h2  { font-size: 17px; font-weight: 700; }
.section-hdr .sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* ===== Exercise card ===== */
.ex-card {
  background: var(--card);
  border-radius: 12px; padding: 14px 14px 10px;
  margin-bottom: 10px;
  border-left: 3px solid var(--border2);
  transition: opacity 0.3s;
  box-shadow: var(--shadow);
}
.ex-card.done { opacity: 0.6; border-left-color: color-mix(in srgb, var(--green) 50%, transparent); }
.ex-name { font-size: 14px; font-weight: 600; color: var(--text); }
.ex-name.done-text { color: var(--green); }
.ex-meta { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }
.ex-note { font-size: 11px; color: var(--text3); margin: 6px 0 10px; font-style: italic; }

/* ===== Set row ===== */
.set-grid { display: flex; flex-direction: column; gap: 6px; }
.set-row  { display: flex; align-items: center; gap: 10px; height: 36px; }
.chk {
  width: 28px; height: 28px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; border: 2px solid var(--border2);
  flex-shrink: 0; font-size: 12px; color: #fff; padding: 0;
}
.chk.checked { border-color: var(--c); background: var(--c); }
.set-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; width: 48px; flex-shrink: 0; color: var(--text4);
}
.wt-tag {
  padding: 4px 12px; border-radius: 6px;
  font-size: 12px; font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.15s;
  border: 1px solid var(--border2); background: var(--bg); color: var(--text4);
}
.wt-tag.has {
  background: color-mix(in srgb, var(--c) 10%, var(--bg));
  color: var(--c);
  border-color: color-mix(in srgb, var(--c) 35%, transparent);
}
.wt-input-wrap { display: flex; align-items: center; gap: 4px; }
.wt-input {
  width: 64px; padding: 5px 8px; border-radius: 6px;
  border: 1px solid var(--border2); background: var(--bg); color: var(--text); font-size: 13px;
}
.wt-ok {
  width: 28px; height: 28px; border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--green) 40%, transparent);
  background: color-mix(in srgb, var(--green) 12%, transparent);
  color: var(--green); font-size: 14px; padding: 0;
}
.wt-no {
  width: 28px; height: 28px; border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
  background: color-mix(in srgb, var(--red) 8%, transparent);
  color: var(--red); font-size: 12px; padding: 0;
}

/* ===== Set rest timer ===== */
.rest-timer {
  --timer-c: var(--red);
  position: fixed; z-index: 100; left: 50%;
  bottom: calc(var(--safe-bottom) + 14px);
  width: min(calc(100% - 24px), 456px);
  border: 1px solid color-mix(in srgb, var(--timer-c) 55%, var(--border));
  border-radius: 16px; overflow: hidden;
  background: color-mix(in srgb, var(--timer-c) 8%, var(--card));
  box-shadow: 0 14px 40px rgba(0,0,0,0.38);
  opacity: 0; pointer-events: none;
  transform: translate(-50%, calc(100% + 32px));
  transition: opacity 0.22s ease, transform 0.28s cubic-bezier(.2,.8,.2,1), border-color 0.2s;
}
.rest-timer.show {
  opacity: 1; pointer-events: auto;
  transform: translate(-50%, 0);
}
.rest-timer.done { --timer-c: var(--green); }
.rest-timer.done .rest-count { animation: timerPulse 0.7s ease 2; }
.rest-progress { height: 3px; background: color-mix(in srgb, var(--timer-c) 14%, transparent); }
.rest-progress-fill {
  height: 100%; width: 100%; background: var(--timer-c);
  transition: width 0.25s linear, background 0.2s;
}
.rest-timer-main {
  display: grid; grid-template-columns: minmax(0,1fr) auto;
  align-items: center; gap: 12px; padding: 12px 13px 8px;
}
.rest-label { font-size: 12px; color: var(--timer-c); font-weight: 800; letter-spacing: 0.4px; }
.rest-exercise {
  margin-top: 2px; font-size: 11px; color: var(--text3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rest-count {
  min-width: 66px; text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-size: 27px; line-height: 1; font-weight: 700; color: var(--timer-c);
}
.rest-timer-actions { display: flex; gap: 7px; padding: 0 13px 11px; }
.rest-timer-actions button {
  flex: 1; padding: 7px 10px; border-radius: 8px;
  border: 1px solid color-mix(in srgb, var(--timer-c) 32%, var(--border));
  background: color-mix(in srgb, var(--timer-c) 9%, var(--bg));
  color: var(--text2); font-size: 11px; font-weight: 700;
}
.rest-timer-actions button:last-child { color: var(--text3); }
@keyframes timerPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

/* ===== Cardio ===== */
.cardio-card {
  margin-top: 12px; padding: 14px; border-radius: 10px;
  background: color-mix(in srgb, var(--yellow) 6%, var(--card));
  border: 1px solid color-mix(in srgb, var(--yellow) 20%, transparent);
  box-shadow: var(--shadow);
}
.cardio-card .c-title { font-size: 11px; letter-spacing: 2px; color: var(--yellow); margin-bottom: 6px; font-weight: 700; }
.cardio-card .c-body  { font-size: 13px; color: var(--text2); line-height: 1.6; }

/* ===== Rest day ===== */
.rest-day {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 20px; text-align: center;
}

/* ===== Run card ===== */
.run-card {
  display: flex; flex-direction: column; align-items: center;
  gap: 14px; padding: 28px 20px;
  background: var(--card); border-radius: 16px; margin-top: 8px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.run-icon { font-size: 44px; line-height: 1; }
.run-title { font-size: 15px; font-weight: 600; color: var(--text2); text-align: center; }
.run-done { font-size: 24px; font-weight: 700; color: var(--green); }
.run-redo {
  font-size: 12px; color: var(--text4);
  background: none; border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 14px; cursor: pointer;
}
.run-input-row { display: flex; align-items: center; gap: 8px; }
.run-dist-input {
  width: 90px; font-size: 28px; font-weight: 700; text-align: center;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 8px; color: var(--text1);
}
.run-unit { font-size: 20px; font-weight: 600; color: var(--text3); }
.run-submit {
  width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
  background: var(--blue); color: #fff; border: none; border-radius: 14px; cursor: pointer;
}

/* ===== Week view ===== */
.week-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 4px; margin-bottom: 16px;
}
.week-nav span { font-size: 15px; font-weight: 700; }
.week-nav button {
  width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--card); color: var(--text3); font-size: 14px; padding: 0;
}
.week-day {
  display: flex; align-items: center; padding: 12px 14px;
  border-radius: 10px; margin-bottom: 6px;
  border: 1px solid var(--border); background: var(--card);
  width: 100%; text-align: left; box-shadow: var(--shadow);
}
.week-day.today {
  border-color: color-mix(in srgb, var(--red) 35%, transparent);
  background: color-mix(in srgb, var(--red) 6%, var(--card));
}
.week-dow { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; width: 32px; }
.week-info { flex: 1; margin-left: 10px; }
.week-info .name { font-size: 13px; font-weight: 500; color: var(--text2); }
.week-info .name.rest { color: var(--text4); }
.week-info .date { font-size: 10px; color: var(--text4); margin-top: 2px; }
.mini-bar { width: 50px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.mini-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.comp-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600; width: 36px; text-align: right; color: var(--text4);
}
.comp-pct.full { color: var(--green); }

/* ===== Progress ===== */
.prog-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.prog-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--card);
  margin-bottom: 6px; width: 100%; text-align: left; box-shadow: var(--shadow);
}
.prog-row.current {
  border-color: color-mix(in srgb, var(--red) 35%, transparent);
  background: color-mix(in srgb, var(--red) 6%, var(--card));
}
.prog-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; width: 28px; }
.prog-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.prog-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

.stats-box {
  background: var(--card); border-radius: 12px; padding: 16px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.stats-title { font-size: 11px; letter-spacing: 2px; color: var(--text3); margin-bottom: 14px; font-weight: 600; }
.stats-grid { display: flex; gap: 12px; justify-content: space-around; }
.stat-item { text-align: center; }
.stat-num { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; }
.stat-lbl { font-size: 10px; color: var(--text3); margin-top: 4px; letter-spacing: 1px; }

/* ===== Body ===== */
.chart-wrap {
  background: var(--card); border-radius: 12px; padding: 16px;
  border: 1px solid var(--border); margin-bottom: 14px; box-shadow: var(--shadow);
}
.chart-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.chart-tab {
  flex: 1; padding: 6px 0; border-radius: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  border: 1px solid var(--border2); background: var(--bg); color: var(--text4);
  transition: all 0.2s;
}
.chart-tab.active {
  background: color-mix(in srgb, var(--c) 12%, var(--bg));
  border-color: var(--c); color: var(--c);
}
#bodyChart { width: 100%; height: 160px; display: block; }
.chart-empty {
  height: 100px; display: flex; align-items: center; justify-content: center;
  color: var(--text4); font-size: 12px;
}
.body-form {
  background: var(--card); border-radius: 12px; padding: 16px;
  border: 1px solid var(--border); margin-bottom: 16px; box-shadow: var(--shadow);
}
.body-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.body-row label { font-size: 13px; font-weight: 600; width: 48px; color: var(--text3); flex-shrink: 0; }
.body-row input {
  flex: 1; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--bg); color: var(--text); font-size: 15px;
}
.body-submit {
  width: 100%; padding: 12px; border-radius: 8px; border: none;
  background: var(--red); color: #fff; font-size: 14px; font-weight: 700; margin-top: 4px;
}
.body-history {
  background: var(--card); border-radius: 12px; padding: 16px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.body-hist-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.body-hist-row:last-child { border-bottom: none; }
.body-hist-date { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text3); font-weight: 600; }
.body-hist-vals { display: flex; gap: 16px; }
.body-hist-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text2); font-weight: 600; }
.body-hist-val small { font-size: 10px; color: var(--text3); }

.footer {
  text-align: center; padding: 20px 16px 32px;
  font-size: 9px; color: var(--border2);
  letter-spacing: 2px; font-family: 'JetBrains Mono', monospace;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
.fade-in { animation: fadeIn 0.3s ease; }
</style>
</head>
<body>

<!-- 安装提示 -->
<div class="install-hint" id="installHint">
  <span>💡 点击 Safari 底部 <strong>分享</strong> → <strong>添加到主屏幕</strong>，即可像 App 一样使用，数据永久保存</span>
  <button class="dismiss" onclick="dismissHint()">✕</button>
</div>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="brand" id="weekLabel">TEN MILE · WEEK 1/8</div>
      <h1>训练追踪</h1>
    </div>
    <button class="quick-btn off" id="quickBtn" onclick="toggleQuick()">📋 完整</button>
  </div>
  <div class="quick-banner" id="quickBanner">⚡ 精简模式：减少组数，保留核心动作，约30-40分钟完成</div>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-item active" onclick="switchTab('train')" data-tab="train">
    <span class="icon">🏋️</span><span class="label">训练</span>
  </button>
  <button class="tab-item" onclick="switchTab('week')" data-tab="week">
    <span class="icon">📅</span><span class="label">本周</span>
  </button>
  <button class="tab-item" onclick="switchTab('progress')" data-tab="progress">
    <span class="icon">📊</span><span class="label">进度</span>
  </button>
  <button class="tab-item" onclick="switchTab('body')" data-tab="body">
    <span class="icon">📐</span><span class="label">身体</span>
  </button>
</div>

<!-- Content -->
<div class="content">
  <div class="tab-content active" id="tab-train"></div>
  <div class="tab-content" id="tab-week"></div>
  <div class="tab-content" id="tab-progress"></div>

// ─── HELPERS ──────────────────────────────────────────────
function dateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function todayStr() { return dateStr(new Date()); }
function parseLocalDate(value) {
  if (value instanceof Date) {
    return new Date(value.getFullYear(), value.getMonth(), value.getDate());
  }
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if (!match) return new Date(NaN);
  return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
}
function localDayNumber(d) {
  return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5;
}

function getWeekNum(d) {
  const s = parseLocalDate(PROGRAM_START);
  const startMon = new Date(s);
  startMon.setDate(s.getDate() - ((s.getDay() + 6) % 7)); // 回退到周一
  const target = parseLocalDate(d);
  const elapsedDays = localDayNumber(target) - localDayNumber(startMon);
  return Math.max(0, Math.min(Math.floor(elapsedDays / 7), TOTAL_WEEKS - 1));
}
function getWeekDates(w) {
  const s = parseLocalDate(PROGRAM_START);
  const startMon = new Date(s);
  startMon.setDate(s.getDate() - ((s.getDay() + 6) % 7)); // 回退到周一
  startMon.setDate(startMon.getDate() + w * 7);
  return Array.from({length:7}, (_, i) => { const d = new Date(startMon); d.setDate(d.getDate()+i); return d; });
}
function getScheduleForDate(value) {
  const date = parseLocalDate(value);
  const ds = dateStr(date);
  const dow = date.getDay();
  const base = WEEK_TPL.find(w => w.dow === dow);
  const week = getWeekNum(date);
  const run = RUN_PLAN[week];

  if (ds === RACE_DATE) {
    return {dow:5, label:"周五", dayId:null, note:"十英里比赛 · 16.1km · 目标 <6:00/km（理想5:45-5:55/km）", distance:16.1};
  }
  if (week === TOTAL_WEEKS - 1 && dow === 6) {
    return {dow:6, label:"周六", dayId:null, note:"赛后恢复 · 休息或轻松走"};
  }
  if (week === TOTAL_WEEKS - 1 && dow === 0) {
    return {dow:0, label:"周日", dayId:null, note:run.long};
  }
  if (dow === 2) return {...base, note:run.quality, distance:run.distance};
  if (dow === 0) return {...base, note:run.long, distance:run.longDistance};
  return base;
}
function getTodayDayId() {
  const t = getScheduleForDate(selectedDate);
  return t?.dayId || null;
}

// 返回 selectedDate 所在周内指定训练日的本地日期
function getDateForDayId(dayId) {
  const tmpl = WEEK_TPL.find(w => w.dayId === dayId);
  if (!tmpl) return selectedDate;
  const base = parseLocalDate(selectedDate);
  const monday = new Date(base);
  monday.setDate(base.getDate() - ((base.getDay() + 6) % 7));
  const target = new Date(monday);
  target.setDate(monday.getDate() + ((tmpl.dow + 6) % 7));
  return dateStr(target);
}

// D1-D3 健身房版沿用历史无后缀日志键；旧 D4-D5 健身房日志仍保留 g 后缀
function gymVariantSuffix(dayId) {
  return dayId <= 3 ? '' : 'g';
}

// 返回当前训练版本的日志后缀
function variantSuffix(dayId) {
  const ex = EXERCISES[dayId];
  if (ex?.homeOnly) return 'h';
  if (!ex || ex.gym === undefined) return '';
  return gymMode[dayId] ? gymVariantSuffix(dayId) : 'h';
}

// 当前 selectedDate + dayId 对应的 log 键
function logKey(dayId) {
  return `${selectedDate}-d${dayId}${variantSuffix(dayId)}`;
}

// 返回当前 gymMode 下的训练数据对象
function getDayData(dayId) {
  const ex = EXERCISES[dayId];
  if (!ex) return null;
  if (ex.homeOnly) return ex.home;
  if (ex.gym !== undefined) return gymMode[dayId] ? ex.gym : ex.home;
  return ex;
}

function variantHasDone(date, dayId, suffix) {
  const log = logs[`${date}-d${dayId}${suffix}`];
  return !!log && Object.values(log).some(set => set?.done === true);
}

// 周视图标题按该日期实际打卡版本显示，不改变当前选择
function getDayDataForDate(dayId, date) {
  const ex = EXERCISES[dayId];
  if (!ex) return null;
  if (ex.homeOnly) return ex.home;
  if (ex.gym === undefined) return ex;
  const gymDone  = variantHasDone(date, dayId, gymVariantSuffix(dayId));
  const homeDone = variantHasDone(date, dayId, 'h');
  if (gymDone && !homeDone) return ex.gym;
  if (homeDone && !gymDone) return ex.home;
  return gymMode[dayId] ? ex.gym : ex.home;
}

// 从周视图跳转时，自动检测该日期已打卡的版本
function autoDetectVariant(dayId, date) {
  const ex = EXERCISES[dayId];
  if (!ex || ex.homeOnly || ex.gym === undefined) return;
  const gymDone  = variantHasDone(date, dayId, gymVariantSuffix(dayId));
  const homeDone = variantHasDone(date, dayId, 'h');
  if (gymDone && !homeDone)       gymMode[dayId] = true;
  else if (homeDone && !gymDone)  gymMode[dayId] = false;
}
function getExercisesForData(dayId, suffix, data) {
  if (!data) return [];
  const full = data.exercises;
  if (!quickMode) return full;
  const key = suffix ? `${dayId}${suffix}` : dayId;
  const qids = QUICK_IDS[key] || [];
  return full.filter(e => qids.includes(e.id)).map(e => ({...e, sets: Math.min(e.sets, 3)}));
}
function getExercises(dayId) {
  return getExercisesForData(dayId, variantSuffix(dayId), getDayData(dayId));
}

function parseRestSeconds(value) {
  const text = String(value || '').trim().toLowerCase();
  const minutes = text.match(/(\d+(?:\.\d+)?)(?:\s*[-–~]\s*(\d+(?:\.\d+)?))?\s*(?:min|分钟|m)/);
  if (minutes) return Math.round(Number(minutes[2] || minutes[1]) * 60);
  const seconds = text.match(/(\d+(?:\.\d+)?)(?:\s*[-–~]\s*(\d+(?:\.\d+)?))?\s*(?:秒|s)/);
  if (seconds) return Math.round(Number(seconds[2] || seconds[1]));
  return 0;
}
function formatRestTime(seconds) {
  const safe = Math.max(0, Math.ceil(seconds));
  return `${Math.floor(safe / 60)}:${String(safe % 60).padStart(2, '0')}`;
}
function findExercise(dayId, exId) {
  return getDayData(dayId)?.exercises?.find(ex => ex.id === exId) || null;
}
function startRestTimer(dayId, exId) {
  const exercise = findExercise(dayId, exId);
  const seconds = parseRestSeconds(exercise?.rest);
  if (!exercise || seconds <= 0) return;
  Object.assign(restTimerState, {
    active:true,
    done:false,
    endAt:Date.now() + seconds * 1000,
    totalSeconds:seconds,
    exerciseName:exercise.name,
    restText:exercise.rest,
    color:DAY_COLORS[dayId] || 'var(--red)'
  });
  if (restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval = setInterval(updateRestTimer, 250);
  renderRestTimer();
}
function addRestTime(seconds) {
  if (!restTimerState.active) return;
  if (restTimerState.done) {
    restTimerState.done = false;
    restTimerState.totalSeconds = seconds;
    restTimerState.endAt = Date.now() + seconds * 1000;
    if (restTimerInterval) clearInterval(restTimerInterval);
    restTimerInterval = setInterval(updateRestTimer, 250);
  } else {
    restTimerState.totalSeconds += seconds;
    restTimerState.endAt += seconds * 1000;
  }
  renderRestTimer();
}
function skipRestTimer() {
  if (restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval = null;
  restTimerState.active = false;
  restTimerState.done = false;
  renderRestTimer();
}
function updateRestTimer() {
  if (!restTimerState.active) return;
  const remaining = Math.max(0, Math.ceil((restTimerState.endAt - Date.now()) / 1000));
  if (remaining <= 0 && !restTimerState.done) {
    restTimerState.done = true;
    if (restTimerInterval) clearInterval(restTimerInterval);
    restTimerInterval = null;
    if (window.navigator.vibrate) window.navigator.vibrate([180, 100, 180]);
  }
  renderRestTimer();
}
function renderRestTimer() {
  const el = document.getElementById('restTimer');
  if (!el) return;
  if (!restTimerState.active) {
    el.className = 'rest-timer';
    return;
  }
  const remaining = restTimerState.done
    ? 0
    : Math.max(0, Math.ceil((restTimerState.endAt - Date.now()) / 1000));
  const progress = restTimerState.done
    ? 100
    : Math.max(0, Math.min(100, (remaining / restTimerState.totalSeconds) * 100));
  el.style.setProperty('--timer-c', restTimerState.color);
  el.className = `rest-timer show${restTimerState.done ? ' done' : ''}`;
  document.getElementById('restProgress').style.width = `${progress}%`;
  document.getElementById('restTimerLabel').textContent = restTimerState.done ? '休息结束 · 开始下一组' : '组间休息倒计时';
  document.getElementById('restTimerExercise').textContent = `${restTimerState.exerciseName} · 建议休息 ${restTimerState.restText}`;
  document.getElementById('restTimerCount').textContent = restTimerState.done ? 'GO' : formatRestTime(remaining);
  document.getElementById('restTimerClose').textContent = restTimerState.done ? '关闭' : '跳过';
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) updateRestTimer();
});

function isSetDone(dayId, exId, si) {
  return logs[logKey(dayId)]?.[`${exId}-${si}`]?.done || false;
}
function getSetWeight(dayId, exId, si) {
  return logs[logKey(dayId)]?.[`${exId}-${si}`]?.weight;
}
function toggleSet(dayId, exId, si) {
  const k = logKey(dayId);
  if (!logs[k]) logs[k] = {};
  const ek = `${exId}-${si}`;
  const wasDone = !!logs[k][ek]?.done;
  if (wasDone) delete logs[k][ek];
  else logs[k][ek] = {done:true, weight:null};
  if (Object.keys(logs[k]).length === 0) delete logs[k];
  save(); renderTrain();
  if (!wasDone) startRestTimer(dayId, exId);
}
function setWeight(dayId, exId, si, val) {
  const k = logKey(dayId);
  if (!logs[k]) logs[k] = {};
  const wasDone = !!logs[k][`${exId}-${si}`]?.done;
  logs[k][`${exId}-${si}`] = {done:true, weight:parseFloat(val)||null};
  save(); editingWeight = null; renderTrain();
  if (!wasDone) startRestTimer(dayId, exId);
}

function logRun(date, dist) {
  const d = parseFloat(dist);
  if (!d || d <= 0) return;
  runLogs[date] = d;
  saveRuns(); renderTrain();
}
function deleteRun(date) {
  delete runLogs[date];
  saveRuns(); renderTrain();
}

// 单变体完成率内部计算
function _compVariant(date, dayId, suffix, data) {
  if (!data) return 0;
  const k   = `${date}-d${dayId}${suffix}`;
  const log = logs[k];
  if (!log) return 0;
  const exercises = getExercisesForData(dayId, suffix, data);
  const total = exercises.reduce((sum, exercise) => sum + exercise.sets, 0);
  const done = exercises.reduce((sum, exercise) => {
    return sum + Array.from({length: exercise.sets}, (_, i) => {
      return log[`${exercise.id}-${i}`]?.done ? 1 : 0;
    }).reduce((a, b) => a + b, 0);
  }, 0);
  return total > 0 ? Math.min(done/total, 1) : 0;
}

// 双版本训练日取两个版本中较大的完成率（任意版本打卡都算）
function getDayComp(date, dayId) {
  const ex = EXERCISES[dayId];
  if (!ex) return 0;
  if (ex.homeOnly) return _compVariant(date, dayId, 'h', ex.home);
  if (ex.gym !== undefined) {
    return Math.max(
      _compVariant(date, dayId, gymVariantSuffix(dayId), ex.gym),
      _compVariant(date, dayId, 'h', ex.home)
    );
  }
  return _compVariant(date, dayId, '', ex);
}
function getWeekComp(w) {
  const dates = getWeekDates(w);
  let tot = 0, comp = 0, coreBest = 0, hasCoreSlot = false;
  dates.forEach(d => {
    const ds = dateStr(d);
    const t = getScheduleForDate(ds);
    if (t?.dayId && t.dayId <= 3) {
      tot++;
      if (getDayComp(ds, t.dayId) > 0.5) comp++;
    } else if (t?.dayId && (t.dayId === 4 || t.dayId === 5)) {
      hasCoreSlot = true;
      coreBest = Math.max(coreBest, getDayComp(ds, t.dayId));
    } else if (t?.distance) {
      tot++;
      if (runLogs[ds] > 0) comp++;
    }
  });
  if (hasCoreSlot) { tot++; if (coreBest > 0.5) comp++; }
  return tot > 0 ? comp/tot : 0;
}

// ─── TAB SWITCHING ────────────────────────────────────────
function switchTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab-item').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === id);
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    c.classList.toggle('active', c.id === `tab-${id}`);
  });
  selectedDayId = null;
  render();
}
function toggleQuick() {
  quickMode = !quickMode;
  localStorage.setItem("xh-quick", JSON.stringify(quickMode));
  const btn = document.getElementById('quickBtn');
  btn.className = `quick-btn ${quickMode?'on':'off'}`;
  btn.textContent = quickMode ? '⚡ 精简' : '📋 完整';
  document.getElementById('quickBanner').classList.toggle('show', quickMode);
  render();
}

// ─── RENDER ───────────────────────────────────────────────
function render() {
  const w = getWeekNum(new Date());
  document.getElementById('weekLabel').textContent = `TEN MILE · WEEK ${w+1}/${TOTAL_WEEKS}`;
  if      (currentTab==='train')    renderTrain();
  else if (currentTab==='week')     renderWeek();
  else if (currentTab==='progress') renderProgress();
  else if (currentTab==='body')     renderBody();
}

function renderTrain() {
  const el = document.getElementById('tab-train');
  const activeDayId = selectedDayId || getTodayDayId();
  if (activeDayId && selectedDayId === null) autoDetectVariant(activeDayId, selectedDate);
  const c = activeDayId ? DAY_COLORS[activeDayId] : '#666';

  // ── D1-D5 选择按钮 ──
  let h = `<div class="race-goal">
    <div class="goal-kicker">RACE · 2026.10.16</div>
    <div class="goal-main">16.1km 平均配速 &lt;6:00/km</div>
    <div class="goal-sub">理想 5:45-5:55/km · 备赛期保持肌肉量</div>
  </div><div class="day-selector">`;
  [1,2,3,4,5].forEach(d => {
    const targetDate = getDateForDayId(d);
    if (getScheduleForDate(targetDate)?.dayId !== d) return;
    const act  = activeDayId === d;
    const data = getDayData(d);
    h += `<button class="day-btn${act?' active':''}" style="--c:${DAY_COLORS[d]}"
      onclick="selectedDayId=${d};selectedDate=getDateForDayId(${d});autoDetectVariant(${d},selectedDate);renderTrain()">
      <span class="emoji">${data?.icon || '❓'}</span>
      <span class="d-label">D${d}</span>
    </button>`;
  });
  h += `</div>`;

  // ── 健身房 / 居家版本切换 ──
  if (activeDayId && !EXERCISES[activeDayId]?.homeOnly && EXERCISES[activeDayId]?.gym !== undefined) {
    const isGym = gymMode[activeDayId];
    h += `<div class="variant-toggle">
      <button class="var-btn${isGym?' active':''}" style="--c:${c}"
        onclick="gymMode[${activeDayId}]=true;saveGymMode();renderTrain()">🏋️ 健身房版</button>
      <button class="var-btn${!isGym?' active':''}" style="--c:${c}"
        onclick="gymMode[${activeDayId}]=false;saveGymMode();renderTrain()">🏠 居家版</button>
    </div>`;
  }

  if (activeDayId && getDayData(activeDayId)) {
    const data = getDayData(activeDayId);
    const exs  = getExercises(activeDayId);
    const dayLabel = WEEK_TPL.find(t => t.dayId === activeDayId)?.label || '';
    const sessionLabel = activeDayId >= 4 ? '周五/周六二选一即可' : (quickMode?'精简模式 · 核心动作':'完整训练');
    h += `<div class="section-hdr" style="--c:${c};border-left-color:${c}">
      <h2>${data.title}</h2>
      <div class="sub">${sessionLabel} · <span style="color:${c}">${dayLabel}</span></div>
    </div>`;

    exs.forEach(ex => {
      const allDone = Array.from({length:ex.sets}, (_,i) => isSetDone(activeDayId,ex.id,i)).every(Boolean);
      h += `<div class="ex-card${allDone?' done':''}" style="border-left-color:${allDone?'':''+c+'40'}">
        <div class="ex-name${allDone?' done-text':''}">${allDone?'✓ ':''}${ex.name}</div>
        <div class="ex-meta">${ex.reps} · 休息${ex.rest}</div>
        <div class="ex-note">💡 ${ex.note}</div>
        <div class="set-grid">`;

      for (let si = 0; si < ex.sets; si++) {
        const done      = isSetDone(activeDayId, ex.id, si);
        const w         = getSetWeight(activeDayId, ex.id, si);
        const isEditing = editingWeight === `${ex.id}-${si}`;
        h += `<div class="set-row">
          <button class="chk${done?' checked':''}" style="--c:${c}"
            onclick="toggleSet(${activeDayId},'${ex.id}',${si})">${done?'✓':''}</button>
          <span class="set-label">第${si+1}组</span>`;

        if (ex.tracked) {
          if (isEditing) {
            h += `<div class="wt-input-wrap">
              <input type="number" inputmode="decimal" placeholder="kg"
                id="wi-${ex.id}-${si}" class="wt-input" value="${w||''}"
                onkeydown="if(event.key==='Enter')setWeight(${activeDayId},'${ex.id}',${si},this.value)">
              <button class="wt-ok"
                onclick="setWeight(${activeDayId},'${ex.id}',${si},document.getElementById('wi-${ex.id}-${si}').value)">✓</button>
              <button class="wt-no" onclick="editingWeight=null;renderTrain()">✕</button>
            </div>`;
          } else {
            h += `<button class="wt-tag${w?' has':''}" style="--c:${c}"
              onclick="editingWeight='${ex.id}-${si}';renderTrain();setTimeout(()=>{const i=document.getElementById('wi-${ex.id}-${si}');if(i)i.focus();},50)">
              ${w?w+'kg':'+kg'}</button>`;
          }
        }
        h += `</div>`;
      }
      h += `</div></div>`;
    });

    if (data.cardio) {
      h += `<div class="cardio-card"><div class="c-title">有氧</div><div class="c-body">${data.cardio}</div></div>`;
    }
  } else {
    const tmpl = getScheduleForDate(selectedDate);
    const isRunDay = tmpl?.distance > 0;
    if (isRunDay) {
      const defaultDist = tmpl.distance;
      const logged = runLogs[selectedDate];
      if (logged) {
        h += `<div class="run-card">
          <div class="run-icon">🏃</div>
          <div class="run-title">${tmpl.note}</div>
          <div class="run-done">已打卡 ${logged} km ✓</div>
          <button class="run-redo" onclick="deleteRun('${selectedDate}')">重新记录</button>
        </div>`;
      } else {
        h += `<div class="run-card">
          <div class="run-icon">🏃</div>
          <div class="run-title">${tmpl.note}</div>
          <div class="run-input-row">
            <input type="number" inputmode="decimal" id="runDist" class="run-dist-input" placeholder="距离" value="${defaultDist}">
            <span class="run-unit">km</span>
          </div>
          <button class="run-submit" onclick="logRun('${selectedDate}',document.getElementById('runDist').value)">完成打卡</button>
        </div>`;
      }
    } else {
      h += `<div class="rest-day">
        <div style="font-size:40px;margin-bottom:12px">😴</div>
        <div style="font-size:16px;font-weight:600;color:var(--text3)">${tmpl?.note||'休息日'}</div>
        <div style="font-size:12px;color:var(--text4);margin-top:8px">点击上方选择训练日 · 或享受恢复</div>
      </div>`;
    }
  }
  el.innerHTML = h;
}

function renderWeek() {
  const el    = document.getElementById('tab-week');
  const dates = getWeekDates(viewWeek);
  let h = `<div class="week-nav">
    <button onclick="viewWeek=Math.max(0,viewWeek-1);renderWeek()">◀</button>
    <span>第 ${viewWeek+1} 周</span>
    <button onclick="viewWeek=Math.min(${TOTAL_WEEKS-1},viewWeek+1);renderWeek()">▶</button>
  </div>`;

  dates.forEach(d => {
    const ds      = dateStr(d), isToday = ds === todayStr();
    const tmpl    = getScheduleForDate(ds);
    const comp    = tmpl?.dayId ? getDayComp(ds, tmpl.dayId) : null;
    // 标题按该日期实际打卡版本显示，避免渲染周视图时改变全局模式
    const prog = tmpl?.dayId ? getDayDataForDate(tmpl.dayId, ds) : null;
    const dayColor= tmpl?.dayId ? DAY_COLORS[tmpl.dayId] : 'var(--text4)';

    const clickAction = tmpl?.dayId
      ? `selectedDate='${ds}';selectedDayId=${tmpl.dayId};autoDetectVariant(${tmpl.dayId},'${ds}');switchTab('train')`
      : tmpl?.distance
        ? `selectedDate='${ds}';selectedDayId=null;switchTab('train')`
        : '';
    h += `<button class="week-day${isToday?' today':''}"
      onclick="${clickAction}"
      style="cursor:${tmpl?.dayId||tmpl?.distance?'pointer':'default'}">
      <div style="display:flex;align-items:center;gap:10px;flex:1">
        <div class="week-dow" style="color:${isToday?'var(--red)':dayColor}">${tmpl?.label}</div>
        <div class="week-info">
          <div class="name${prog?'':' rest'}">${prog?prog.title:tmpl?.note||''}</div>
          <div class="date">${d.getMonth()+1}/${d.getDate()}</div>
        </div>
      </div>`;
    if (comp !== null) {
      const barColor = comp >= 1 ? 'var(--green)' : dayColor;
      h += `<div style="display:flex;align-items:center;gap:8px">
        <div class="mini-bar"><div class="mini-bar-fill" style="width:${comp*100}%;background:${barColor}"></div></div>
        <span class="comp-pct${comp>=1?' full':''}">${Math.round(comp*100)}%</span>
      </div>`;
    } else if (!tmpl?.dayId && tmpl?.distance && runLogs[ds]) {
      h += `<span class="comp-pct full">${runLogs[ds]}km</span>`;
    }
    h += `</button>`;
  });
  el.innerHTML = h;
}

function renderProgress() {
  const el   = document.getElementById('tab-progress');
  const curW = getWeekNum(new Date());
  let h = `<div class="prog-title">8周十英里备赛进度</div>`;
  for (let w = 0; w < TOTAL_WEEKS; w++) {
    const comp     = getWeekComp(w);
    const isCur    = w === curW, isPast = w < curW;
    const barColor = comp>=0.75 ? 'var(--green)' : comp>=0.5 ? 'var(--yellow)' : comp>0 ? 'var(--red)' : 'transparent';
    const lblColor = isCur ? 'var(--red)' : isPast ? 'var(--text3)' : 'var(--text4)';
    const pctColor = comp>=0.75 ? 'var(--green)' : comp>0 ? 'var(--yellow)' : 'var(--text5)';
    h += `<button class="prog-row${isCur?' current':''}" onclick="viewWeek=${w};switchTab('week')">
      <span class="prog-label" style="color:${lblColor}">W${w+1}</span>
      <div class="prog-bar"><div class="prog-bar-fill" style="width:${comp*100}%;background:${barColor}"></div></div>
      <span class="comp-pct" style="color:${pctColor}">${Math.round(comp*100)}%</span>
    </button>`;
  }

  let sessions = Object.values(logs).filter(day =>
    Object.values(day).some(set => set?.done === true)
  ).length;
  let totalSets = 0, totalWeight = 0;
  Object.values(logs).forEach(day => {
    Object.values(day).forEach(s => {
      if (s.done)   totalSets++;
      if (s.weight) totalWeight += s.weight;
    });
  });
  const wtDisplay = totalWeight > 1000 ? (totalWeight/1000).toFixed(1)+'t' : Math.round(totalWeight);

  h += `<div class="stats-box" style="margin-top:20px">
    <div class="stats-title">总览</div>
    <div class="stats-grid">
      <div class="stat-item"><div class="stat-num">${sessions}</div><div class="stat-lbl">训练次数</div></div>
      <div class="stat-item"><div class="stat-num">${totalSets}</div><div class="stat-lbl">完成组数</div></div>
      <div class="stat-item"><div class="stat-num">${wtDisplay}</div><div class="stat-lbl">总负重(kg)</div></div>
    </div>
  </div>`;

  const runEntries = Object.values(runLogs).filter(v => v > 0);
  const totalKm = runEntries.reduce((s, v) => s + v, 0);
  const avgKm = runEntries.length ? (totalKm / runEntries.length).toFixed(1) : '—';
  h += `<div class="stats-box" style="margin-top:12px">
    <div class="stats-title">跑步记录</div>
    <div class="stats-grid">
      <div class="stat-item"><div class="stat-num">${runEntries.length}</div><div class="stat-lbl">跑步次数</div></div>
      <div class="stat-item"><div class="stat-num">${totalKm.toFixed(1)}</div><div class="stat-lbl">总里程(km)</div></div>
      <div class="stat-item"><div class="stat-num">${avgKm}</div><div class="stat-lbl">平均(km)</div></div>
    </div>
  </div>`;
  el.innerHTML = h;
}

  const METRICS = [
    {key:"weight", label:"体重",  unit:"kg",  color:"var(--red)"},
    {key:"muscle", label:"骨骼肌", unit:"kg", color:"var(--blue)"},
    {key:"bf",     label:"体脂率", unit:"%",  color:"var(--yellow)"},
  ];

  // ── 图表区 ──
  let h = `<div class="chart-wrap">
    <div class="chart-tabs">`;
  METRICS.forEach(m => {
    const act = chartMetric === m.key;
    h += `<button class="chart-tab${act?' active':''}" style="--c:${m.color}"
      onclick="chartMetric='${m.key}';localStorage.setItem('xh-chart-metric','${m.key}');renderBody()"
    >${m.label}</button>`;
  });
  h += `</div>`;

  const metric  = METRICS.find(m => m.key === chartMetric);
  const points  = bodyStats.filter(s => s[chartMetric] != null);
  if (points.length >= 2) {
    h += `<canvas id="bodyChart"></canvas>`;
  } else {
    h += `<div class="chart-empty">记录 2 条以上数据后显示图表</div>`;
  }
  h += `</div>`;

  // ── 录入表单 ──
  h += `<div class="body-form">
    <div class="body-row"><label>体重</label><input type="number" inputmode="decimal" placeholder="kg" id="bw"></div>
    <div class="body-row"><label>骨骼肌</label><input type="number" inputmode="decimal" placeholder="kg" id="bm"></div>
    <div class="body-row"><label>体脂%</label><input type="number" inputmode="decimal" placeholder="%" id="bbf"></div>
    <button class="body-submit" onclick="addBodyStat()">记录今日数据</button>
  </div>`;

  // ── 历史记录 ──
  if (bodyStats.length > 0) {
    h += `<div class="body-history">
      <div style="font-size:11px;letter-spacing:2px;color:var(--text3);margin-bottom:12px;font-weight:600">历史记录</div>`;
    [...bodyStats].reverse().forEach(s => {
      h += `<div class="body-hist-row">
        <span class="body-hist-date">${s.date.slice(5)}</span>
        <div class="body-hist-vals">
          ${s.weight != null ? `<span class="body-hist-val">${s.weight}<small>kg</small></span>` : ''}
          ${s.muscle != null ? `<span class="body-hist-val">${s.muscle}<small>肌</small></span>` : ''}
          ${s.bf     != null ? `<span class="body-hist-val">${s.bf}<small>%</small></span>`     : ''}
        </div>
      </div>`;
    });
    h += `</div>`;
  }

  el.innerHTML = h;

  // ── 绘图（DOM 已挂载后执行）──
  if (points.length >= 2) drawChart(points, metric);
}

function drawChart(points, metric) {
  const canvas = document.getElementById('bodyChart');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.offsetWidth  || canvas.parentElement.clientWidth - 32;
  const H   = 160;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const textColor   = isDark ? '#AAA8A4' : '#888';
  const gridColor   = isDark ? '#2E2E35' : '#E0DDD6';
  const dotColor    = metric.color.replace('var(--red)','#E8453C').replace('var(--blue)','#3A8EE6')
                               .replace('var(--yellow)','#F7C048').replace('var(--green)','#4DC85A');

  const vals   = points.map(p => p[metric.key]);
  const minV   = Math.min(...vals);
  const maxV   = Math.max(...vals);
  const range  = maxV - minV || 1;
  const pad    = { top:20, bottom:28, left:38, right:16 };
  const cW     = W - pad.left - pad.right;
  const cH     = H - pad.top  - pad.bottom;

  const xOf = i => pad.left + (i / (points.length - 1)) * cW;
  const yOf = v => pad.top  + (1 - (v - minV) / range) * cH;

  // 水平网格线（3条）
  ctx.strokeStyle = gridColor;
  ctx.lineWidth   = 1;
  [0, 0.5, 1].forEach(t => {
    const y = pad.top + t * cH;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + cW, y); ctx.stroke();
    const v = (maxV - t * range).toFixed(1);
    ctx.fillStyle = textColor;
    ctx.font = `10px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'right';
    ctx.fillText(v, pad.left - 4, y + 3.5);
  });

  // X 轴日期标签（首/末/中间最多3个）
  ctx.textAlign = 'center';
  const labelIdx = points.length <= 3
    ? points.map((_,i) => i)
    : [0, Math.floor((points.length-1)/2), points.length-1];
  labelIdx.forEach(i => {
    ctx.fillStyle = textColor;
    ctx.font = `10px 'JetBrains Mono', monospace`;
    ctx.fillText(points[i].date.slice(5), xOf(i), H - 6);
  });

  // 折线
  const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + cH);
  grad.addColorStop(0, dotColor + '55');
  grad.addColorStop(1, dotColor + '00');

  ctx.beginPath();
  points.forEach((p, i) => {
    i === 0 ? ctx.moveTo(xOf(i), yOf(p[metric.key])) : ctx.lineTo(xOf(i), yOf(p[metric.key]));
  });
  ctx.strokeStyle = dotColor;
  ctx.lineWidth   = 2;
  ctx.lineJoin    = 'round';
  ctx.stroke();

  // 填充渐变（重新描一次路径加底边）
  ctx.beginPath();
  points.forEach((p, i) => {
    i === 0 ? ctx.moveTo(xOf(i), yOf(p[metric.key])) : ctx.lineTo(xOf(i), yOf(p[metric.key]));
  });
  ctx.lineTo(xOf(points.length-1), pad.top + cH);
  ctx.lineTo(xOf(0), pad.top + cH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // 数据点 + 最后一个值标注
  points.forEach((p, i) => {
    const x = xOf(i), y = yOf(p[metric.key]);
    ctx.beginPath();
    ctx.arc(x, y, i === points.length-1 ? 4 : 3, 0, Math.PI*2);
    ctx.fillStyle = dotColor;
    ctx.fill();
    if (i === points.length-1) {
      ctx.fillStyle = dotColor;
      ctx.font = `bold 11px 'JetBrains Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(p[metric.key] + metric.unit, x, y - 10);
    }
  });
}

function addBodyStat() {
  const w  = document.getElementById('bw').value;
  const m  = document.getElementById('bm').value;
  const bf = document.getElementById('bbf').value;
  if (!w && !m && !bf) return;
  const entry = {
    date:   todayStr(),
    weight: parseFloat(w)  || null,
    muscle: parseFloat(m)  || null,
    bf:     parseFloat(bf) || null,
  };
  bodyStats = bodyStats.filter(s => s.date !== entry.date);
  bodyStats.push(entry);
  bodyStats.sort((a,b) => a.date.localeCompare(b.date));
  saveBody();
  renderBody();
}

// ─── INIT ─────────────────────────────────────────────────
const btn = document.getElementById('quickBtn');
btn.className   = `quick-btn ${quickMode?'on':'off'}`;
btn.textContent = quickMode ? '⚡ 精简' : '📋 完整';
document.getElementById('quickBanner').classList.toggle('show', quickMode);
render();
</script>
</body>
